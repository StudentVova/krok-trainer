<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер КРОК-М: Сестринська справа в хірургії</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #22c55e;
            --success-bg: #f0fdf4;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.2);
            text-align: center;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background-color: #64748b; }
        .btn-secondary:hover { background-color: #475569; }

        .search-box {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .progress-container {
            background: var(--border);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-inner {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            width: 100%;
        }

        .option-card:hover:not(.disabled) {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .option-card.correct {
            background-color: var(--success-bg);
            border-color: var(--success);
            color: #166534;
            font-weight: 600;
        }

        .option-card.wrong {
            background-color: var(--error-bg);
            border-color: var(--error);
            color: #991b1b;
        }

        .option-card.disabled { cursor: not-allowed; }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        .badge {
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
        }

        #result-view { text-align: center; }
        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }
        .search-result-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Медичний Онлайн-Тренажер КРОК-М</h1>
        <p>Хірургічна база тестових запитань для медичних сестер</p>
    </header>

    <!-- Dashboard -->
    <div id="dashboard-view" class="card">
        <h3 style="margin-bottom: 16px; color: var(--primary-color);">Оберіть режим тестування:</h3>
        <div class="menu-grid">
            <button class="btn" onclick="startQuiz('all')">📚 Всі питання підряд</button>
            <button class="btn btn-secondary" onclick="startQuiz('exam')">⏱️ Іспит (50 випадкових питань)</button>
        </div>
        
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;">
        
        <h3 style="color: var(--primary-color);">🔍 Пошук відповідей за ключовим словом:</h3>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Введіть слово для пошуку (наприклад: джгут, шлунок, опік)..." oninput="liveSearch()">
        </div>
        <div id="search-results-count" class="badge" style="display:none; margin-bottom: 16px;"></div>
        <div id="search-results"></div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" class="card" style="display: none;">
        <div class="stats-bar">
            <span id="stat-progress">Запитання: 1/100</span>
            <span id="stat-score">Правильно: 0</span>
        </div>
        <div class="progress-container">
            <div id="progress-inner" class="progress-inner"></div>
        </div>
        <div id="question-area">
            <div class="question-text" id="q-text">Текст запитання</div>
            <div class="options-container" id="q-options"></div>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" onclick="exitToDashboard()">🏠 На головну</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Далі ➡️</button>
        </div>
    </div>

    <!-- Result View -->
    <div id="result-view" class="card" style="display: none;">
        <h2>Тестування завершено!</h2>
        <div class="score-display" id="res-score">0%</div>
        <p id="res-details" style="font-size: 18px; margin-bottom: 24px;"></p>
        <button class="btn" onclick="exitToDashboard()">Повернутися до меню</button>
    </div>
</div>

<script>
    const database = [{"question": "До шкільної медсестри звернувся школяр, який поранив склом праву гомілку. Під час огляду медична сестра виявила рану 3x1 см, з якої рівномірним струменем витікає темна кров. Який метод тимчасової зупинки кровотечі треба застосувати в цьому разі?", "options": ["Накладання стискальної пов’язки", "Накладання оклюзійної пов’язки С. Накладання джгута", "Згинання кінцівки в суглобі", "Пальцеве притиснення артерії"], "correct": 0}, {"question": "У пацієнта 30 років, який має в анамнезі виразкову хворобу шлунка, раптово погіршився загальний стан. З’явились різка слабкість, нудота, блювання. Блювотні маси кольору «кавової гущі». Яке ускладнення виразкової хвороби виникло в пацієнта?", "options": ["Пенетрація виразки", "Пілоростеноз С. Малігнізація виразки", "Шлункова кровотеча", "Перфорація виразки"], "correct": 2}, {"question": "У жінки, яка хворіє на цироз печінки, розвинулось варикозне розширення вен стравоходу та ускладнилося кровотечею. Що використовується в разі кровотечі з варикозно розширених вен стравоходу?", "options": ["Зонд Блекмора", "Шлунковий зонд С. Назоінтестинальний зонд", "Інтубаційна трубка", "Назогастральний зонд"], "correct": 0}, {"question": "До сімейної медичної сестри звернувся пацієнт із скаргами на біль у животі, загальну слабкість. З анамнезу стало відомо, що три години тому під час бійки отримав удар ногою в ділянку живота. Об’єктивно спостерігається: загальний стан погіршується, шкіра бліда, живіт м’який, локальний біль та напруження м’язів у ділянці удару. Ушкоджена частина живота відстає в акті дихання. Які найперші дії слід виконати медичній сестрі?", "options": ["Грілка на живіт, негайна госпіталізація", "Холод на живіт, негайна госпіталізація С. Застосування спазмолітиків", "Амбулаторне спостереження", "Застосування анальгетиків"], "correct": 1}, {"question": "У літній період пацієнт із накладеним артеріальним джгутом транспортується до лікарні. Укажіть максимальний термін накладання джгута в літній період:", "options": ["Не більше ніж 1 година", "Не більше ніж 3 години С. Не більше ніж 30 хвилин", "До прибуття до лікарні", "Не більше ніж 2,5 години"], "correct": 0}, {"question": "Пацієнту 60 років призначено ендоскопічне дослідження слизової оболонки сигмоподібної та прямої кишок. Як називається цей метод дослідження?", "options": ["Цистоскопія", "Колоноскопія С. Фіброгастроскопія", "Ректороманоскопія", "Лапароскопія"], "correct": 2}, {"question": "У пацієнтки 3-ї доби після закритої черепно-мозкової травми спостерігається симптом «окулярів». Яку патологію можна припустити?", "options": ["Перелом кісток носа", "Струс головного мозку С. Забій головного мозку", "Перелом склепіння черепа", "Перелом основи черепа"], "correct": 3}, {"question": "У дитини виникла носова кровотеча. На догоспітальному етапі для зупинки кровотечі необхідно застосувати:", "options": ["Холод на перенісся", "Холод на п’яти С. Холод на грудину", "Холод на підборіддя", "Тепло на перенісся"], "correct": 0}, {"question": "Чоловік після падіння скаржиться на головний біль, нудоту, блювання, запаморочення, не пам’ятає, що з ним трапилося. Для якого патологічного стану найхарактерніші такі симптоми?", "options": ["Забій головного мозку", "Струс головного мозку С. Порушення мозкового кровообігу", "Перелом основи черепа", "Перелом склепіння черепа"], "correct": 1}, {"question": "У пацієнта скарги на сильний біль, почервоніння та набряк шкіри в ділянці лівої гомілки. Захворювання почалося гостро. Об’єктивно спостерігається: температура тіла - 39,5°С, у ділянці середньої третини лівої гомілки є набряклість, почервоніння шкіри з чіткими фестончатими краями. Яке захворювання можна припустити?", "options": ["Гострий тромбофлебіт", "Фурункульоз С. Бешиха", "Лімфангоїт", "Флегмона"], "correct": 0}, {"question": "Медична сестра хірургічного кабінету разом із хірургом оглядаєте пацієнтку 20 років, яка скаржиться на наявність фурункула в ділянці носа. Назвіть найбільш небезпечне ускладнення цього захворювання:", "options": ["Тромбоз кавернозного синуса", "Хронічний гнійний риніт С. Гострий фронтит", "Гострий гнійний синусит", "Носова венозна кровотеча"], "correct": 0}, {"question": "Пацієнт 68 років скаржиться на підвищення температури тіла та виділення під час кашлю великої кількості гнійного мокротиння, з неприємним запахом зеленувато-коричневого кольору. Для якої патології це характерно?", "options": ["Абсцес легень", "Рак легень С. Інфаркт легені", "Бронхіальна астма", "Пневмонія"], "correct": 0}, {"question": "Пацієнтці, яка хворіє на рак молочної залози, проведено курс променевої терапії. Що з наведеного найчастіше спостерігається в загальному аналізі крові після застосування цього методу лікування?", "options": ["Тромбоцитоз", "Лейкоцитоз С. -", "Лейкопенія", "Еритроцитоз"], "correct": 2}, {"question": "Пацієнт 48 років скаржиться на погіршення апетиту, схуднення, слабкість, біль в епігастрії постійного характеру незалежно від приймання їжі, відразу до м’ясної їжі, блювання. З анамнезу відомо, що пацієнт хворів на виразкову хворобу шлунка. Розвиток якого ускладнення в пацієнта можна припустити?", "options": ["Пенетрація виразки", "Перфорація виразки С. Шлункова кровотеча", "Пілоростеноз", "Малігнізація виразки"], "correct": 3}, {"question": "До лікаря звернулася жінка зі скаргами на виділення крові із соска під час натискання на праву молочну залозу. Назвіть традиційний метод дослідження молочних залоз у разі припущення онкологічного захворювання:", "options": ["Мамографія", "Сцинтиграфія С. Сонографія D.-", "Ангіографія"], "correct": 0}, {"question": "Назвіть вид операції, що виконується з метою усунення безпосередньої небезпеки для життя пацієнта або полегшення його стану, але не виліковує його:", "options": ["Паліативна", "Екстрена С. Термінова", "Планова", "Радикальна"], "correct": 0}, {"question": "У пацієнта 62 років, у якого є підозра на рак легень, узято мокротиння для мікроскопічного дослідження. Наявність яких клітин у мокротинні характерне для цього захворювання?", "options": ["Атипових", "Тромбоцитів С. Еозинофілів", "Лейкоцитів", "Еритроцитів"], "correct": 0}, {"question": "Назвіть інструмент, що використовується для дослідження нориць та уведення дренажів:", "options": ["Ложечка Фолькмана", "Троакар С. Ґудзикуватий зонд", "Шпиця Кіршнера", "Коловорот"], "correct": 0}, {"question": "Операційна медсестра готує інструментарій для трахеостомії. Який спеціальний інструмент потрібно підготувати для цієї операції?", "options": ["Розширювач Труссо", "Гачки Фарабефа С. Пилка Джиглі", "Розширювач Мікулича", "Распатор Дуаєна"], "correct": 0}, {"question": "Хірургічна медсестра готує набір інструментів для проведенні операції з приводу геморою. Який спеціальний затискач треба підготувати для захоплення гемороїдальних вузлів?", "options": ["Затискач Кохера", "Затискач Люера С. Затискач Більрота", "Затискач Федорова", "Затискач Мікуліча"], "correct": 1}, {"question": "До травмпункту надійшов чоловік, якого годину тому вкусив бродячий пес. Під час огляду в ділянці лівої гомілки виявлено рану з нерівними краями, незначну кровотечу. Яке незалежне медсестринське втручання потрібно виконати медсестрі насамперед?", "options": ["Накласти давлячу пов’язку", "Надати кінцівці підвищене положення С. Промити рану розчином перекису водню", "Накласти асептичну пов’язку", "Промити рану мильним розчином"], "correct": 3}, {"question": "Пацієнт 35 років скаржиться на біль і судоми в гомілці та ступні, болісну напругу в усьому тілі, тризм жувальної мускулатури. З анамнезу відомо, що 7 днів тому пацієнт проколов ногу цвяхом. Яке захворювання можна припустити?", "options": ["Правець", "Бешиха С. Сепсис", "Флегмона гомілки", "Газова гангрена"], "correct": 0}, {"question": "Під час пожежі чоловік отримав опік правої кисті. Медична сестра, обстежуючи місце пошкодження, діагностувала опік IV ступеня. Яка характерна ознака свідчить про це?", "options": ["Поява міхурів із жовтуватим вмістом", "Некроз сосочкового шару шкіри С. Поява міхурів із геморагічн актерні вказані клінічні прояви?", "options": ["Ниркової коліки", "Гострого апендициту", "Жовчної (печінкової) коліки", "Гострого аднекситу", "Перитоніту"], "correct": 0}, {"question": "Пацієнту віком 67 років встановлено діагноз: абсцес легень. Які з нижченаведених симптомів є найбільш специфічними для цього захворювання?", "options": ["Кашель із виділенням гнійного мокротиння з неприємним запахом об’ємом від 200 мл до 1-2 л за добу, пітливість", "Нападоподібний кашель, задишка з утрудненим та подовженим видихом", "Сухий кашель та інтенсивний біль у грудній клітці, що посилюється під час глибокого вдиху та кашлю", "Кашель із виділенням слизисто-гнійного мокротиння без запаху, займання пацієнтом дренажного положення тіла під час кашлю", "Сухий кашель, біль за грудниною під час кашлю, підвищення температури тіла до субфебрильних цифр"], "correct": 0}, {"question": "Пацієнту встановлено попередній діагноз: сечокам’яна хвороба. Яке додаткове дослідження дозволить визначити локалізацію, величину та форму каменів у нирках?", "options": ["Коронарографія", "Цистоскопія", "Урофлоуметрія", "Оглядова урографія", "Мікроскопія осаду сечі"], "correct": 0}, {"question": "Старша сестра медична хірургічного відділення пояснює своїм підлеглим правила асептики та методи контролю стерильності. Для якого виду контролю лаборанти закладу охорони здоров’я в асептичних умовах беруть змиви з інструментів та зразки простерилізованого матеріалу в маніпуляційних та перев’язувальних кабінетах?", "options": ["Хімічного", "Бактеріологічного", "Візуального", "Механічного", "Фізичного"], "correct": 0}, {"question": "Який метод обробки медичних інструментів є найбільш ефективним для запобігання потраплянню мікроорганізмів у рану під час хірургічного втручання?", "options": ["Висушування", "Стерилізація", "Контамінація", "Зрошування", "Дезінфекція"], "correct": 0}, {"question": "Сестра медична проводить профілактичну освітню роботу серед населення щодо факторів, які підвищують ризик виникнення раку шлунка. Який із нижченаведених факторів є найбільш значущим у розвитку цього захворювання?", "options": ["Хронічний стрес", "Вживання продуктів харчування, що містять канцерогенні речовини", "Екологічне забруднення повітря та води", "Надмірне перебування на сонці (інсоляція)", "Недостатня фізична активність (гіподинамія)"], "correct": 0}, {"question": "Одним із важливих патогенетичних факторів розвитку облітеруючого ендартеріїту є підвищений тонус симпатичної нервової системи. Для його зниження використовуються як консервативні, так і оперативні методи лікування. Яке хірургічне втручання застосовується для корекції цього стану?", "options": ["Накладання обхідного судинного анастомозу", "Балонна ангіопластика", "Ампутація кінцівки", "Ендартеректомія", "Поперекова симпатектомія"], "correct": 0}, {"question": "Пацієнту, який перебуває на стаціонарному лікуванні в нефрологічному відділенні з діагнозом: сечокам’яна хвороба — призначено лікувальну процедуру, що полягає у дробленні каменів у нирках, сечоводах та сечовому міхурі без необхідності хірургічного втручання. Яка саме медична процедура призначена пацієнту?", "options": ["Кінезіотерапія", "Літотрипсія", "Кріотерапія", "Фототерапія", "Електрофорез"], "correct": 0}, {"question": "Пацієнт скаржиться на сильний біль у ділянці лівого стегна, що з’явився після падіння з невеликої висоти два дні тому. Об’єктивно спостерігається: припухлість, гематома на зовнішній поверхні лівого стегна, болючість цієї ділянки під час пальпації. Укажіть вид ушкодження м’яких тканин у пацієнта.", "options": ["Перелом", "Струс", "Розрив", "Забій", "Вивих"], "correct": 0}];

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    function startQuiz(mode) {
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        
        if (mode === 'all') {
            currentQuestions = [...database];
        } else if (mode === 'exam') {
            currentQuestions = [...database].sort(() => 0.5 - Math.random()).slice(0, 50);
        }
        
        currentIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        document.getElementById('next-btn').disabled = true;
        
        const q = currentQuestions[currentIndex];
        document.getElementById('stat-progress').innerText = `Запитання: ${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('stat-score').innerText = `Правильно: ${score}`;
        document.getElementById('progress-inner').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
        
        document.getElementById('q-text').innerText = `${currentIndex + 1}. ${q.question}`;
        
        const optionsDiv = document.getElementById('q-options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-card';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function selectOption(idx, element) {
        if (isAnswered) return;
        isAnswered = true;
        
        const q = currentQuestions[currentIndex];
        const allBtns = document.getElementById('q-options').getElementsByClassName('option-card');
        
        if (idx === q.correct) {
            element.classList.add('correct');
            score++;
            document.getElementById('stat-score').innerText = `Правильно: ${score}`;
        } else {
            element.classList.add('wrong');
            allBtns[q.correct].classList.add('correct');
        }
        
        for (let btn of allBtns) {
            btn.classList.add('disabled');
        }
        
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        
        const percent = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('res-score').innerText = `${percent}%`;
        document.getElementById('res-details').innerText = `Ви відповіли правильно на ${score} з ${currentQuestions.length} запитань.`;
    }

    function exitToDashboard() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
    }

    function liveSearch() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const resultsDiv = document.getElementById('search-results');
        const countBadge = document.getElementById('search-results-count');
        
        if (!query) {
            resultsDiv.innerHTML = '';
            countBadge.style.display = 'none';
            return;
        }
        
        const matched = database.filter(q => q.question.toLowerCase().includes(query));
        countBadge.style.display = 'inline-block';
        countBadge.innerText = `Знайдено питань: ${matched.length}`;
        
        resultsDiv.innerHTML = '';
        matched.slice(0, 20).forEach(q => {
            const div = document.createElement('div');
            div.className = 'search-result-item';
            div.innerHTML = `<strong>Питання:</strong> ${q.question}<br><span style="color:var(--success); font-weight:bold;">Правильна відповідь:</span> ${q.options[q.correct]}`;
            resultsDiv.appendChild(div);
        });
    }
</script>
