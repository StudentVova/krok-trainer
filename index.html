<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер-Тренажер КРОК-М: Сестринська справа</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --success: #22c55e;
            --success-bg: #f0fdf4;
            --error: #ef4444;
            --error-bg: #fef2f2;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.2);
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn-secondary { background-color: #64748b; }
        .btn-secondary:hover { background-color: #475569; }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1); }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .progress-container {
            background: var(--border);
            height: 8px;
            border-radius: 4px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-inner {
            background: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-card:hover:not(.disabled) {
            border-color: var(--primary-color);
            background: #f8fafc;
        }

        .option-card.correct {
            background-color: var(--success-bg);
            border-color: var(--success);
            color: #166534;
            font-weight: 600;
        }

        .option-card.wrong {
            background-color: var(--error-bg);
            border-color: var(--error);
            color: #991b1b;
        }

        .option-card.disabled { cursor: not-allowed; }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        .badge {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        #result-view { text-align: center; }
        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Медичний Онлайн-Тренажер КРОК-М</h1>
        <p>Повна автоматизована хірургічна база тестових запитань для медичних сестер</p>
    </header>

    <!-- Main Navigation / Dashboard -->
    <div id="dashboard-view" class="card">
        <h2 style="margin-bottom: 16px;">Оберіть режим тренування</h2>
        <div class="menu-grid">
            <button class="btn" onclick="startQuiz('all')">📚 Всі питання підряд</button>
            <button class="btn btn-secondary" onclick="startQuiz('exam')">⏱️ Симуляція іспиту (50 випадкових)</button>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Пошук ключового слова в базі питань (напр. джгут, кровотеча)..." oninput="liveSearch()">
        </div>
        <div id="search-results-count" class="badge" style="display:none; margin-bottom: 10px;"></div>
        <div id="search-results" class="options-container"></div>
    </div>

    <!-- Quiz View -->
    <div id="quiz-view" class="card" style="display: none;">
        <div class="stats-bar">
            <span id="stat-progress">Запитання: 1/100</span>
            <span id="stat-score">Правильно: 0</span>
        </div>
        <div class="progress-container">
            <div id="progress-inner" class="progress-inner"></div>
        </div>
        <div id="question-area">
            <div class="question-text" id="q-text">Текст запитання</div>
            <div class="options-container" id="q-options"></div>
        </div>
        <div class="footer-actions">
            <button class="btn btn-secondary" onclick="exitToDashboard()">🏠 Меню</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Далі ➡️</button>
        </div>
    </div>

    <!-- Result View -->
    <div id="result-view" class="card" style="display: none;">
        <h2>Тестування завершено!</h2>
        <div class="score-display" id="res-score">85%</div>
        <p id="res-details" style="font-size: 18px; margin-bottom: 24px;"></p>
        <button class="btn" onclick="exitToDashboard()">Спробувати інший режим</button>
    </div>
</div>

<script>
    const database = {all_questions_json};

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;

    function startQuiz(mode) {
        document.getElementById('dashboard-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        
        if (mode === 'all') {
            currentQuestions = [...database];
        } else if (mode === 'exam') {
            currentQuestions = [...database].sort(() => 0.5 - Math.random()).slice(0, 50);
        }
        
        currentIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        document.getElementById('next-btn').disabled = true;
        
        const q = currentQuestions[currentIndex];
        document.getElementById('stat-progress').innerText = `Запитання: ${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('stat-score').innerText = `Правильно: ${score}`;
        document.getElementById('progress-inner').style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
        
        document.getElementById('q-text').innerText = `${currentIndex + 1}. ${q.question}`;
        
        const optionsDiv = document.getElementById('q-options');
        optionsDiv.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-card';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function selectOption(idx, element) {
        if (isAnswered) return;
        isAnswered = true;
        
        const q = currentQuestions[currentIndex];
        const allBtns = document.getElementById('q-options').getElementsByClassName('option-card');
        
        if (idx === q.correct) {
            element.classList.add('correct');
            score++;
            document.getElementById('stat-score').innerText = `Правильно: ${score}`;
        } else {
            element.classList.add('wrong');
            allBtns[q.correct].classList.add('correct');
        }
        
        for (let btn of allBtns) {
            btn.classList.add('disabled');
        }
        
        document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'block';
        
        const percent = Math.round((score / currentQuestions.length) * 100);
        document.getElementById('res-score').innerText = `${percent}%`;
        document.getElementById('res-details').innerText = `Ви відповіли правильно на ${score} з ${currentQuestions.length} запитань.`;
    }

    function exitToDashboard() {
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('result-view').style.display = 'none';
        document.getElementById('dashboard-view').style.display = 'block';
    }

    function liveSearch() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        const resultsDiv = document.getElementById('search-results');
        const countBadge = document.getElementById('search-results-count');
        
        if (!query) {
            resultsDiv.innerHTML = '';
            countBadge.style.display = 'none';
            return;
        }
        
        const matched = database.filter(q => q.question.toLowerCase().includes(query));
        countBadge.style.display = 'inline-block';
        countBadge.innerText = `Знайдено питань: ${matched.length}`;
        
        resultsDiv.innerHTML = '';
        matched.slice(0, 15).forEach(q => {
            const div = document.createElement('div');
            div.className = 'card';
            div.style.marginBottom = '12px';
            div.innerHTML = `<strong>Питання:</strong> ${q.question}<br><span style="color:var(--success); font-weight:bold;">Правильна відповідь:</span> ${q.options[q.correct]}`;
            resultsDiv.appendChild(div);
        });
    }
</script>

</body>
</html>
