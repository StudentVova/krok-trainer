<html lang="uk">
<head>
    <meta charset="UTF-8">

    <style>
        :root {

        }

        * {

            padding: 0;

        }

        body {

            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);

            border-radius: 12px;

        header {

            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);

        }

        h1 {

            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 15px;
            background: #ebf8ff;
            padding: 12px 20px;
            border-radius: 8px;
            color: #2b6cb0;
        }

            height: 8px;

            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {

            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-box {
            margin-bottom: 25px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            background: #fff;
            border: 2px solid var(--border-color);
            padding: 15px 20px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .option-item:hover:not(.disabled) {
            border-color: var(--primary-color);
            background-color: #f7fafc;
        }

        .option-item.correct {
            background-color: #c6f6d5 !important;
            border-color: var(--success-color) !important;
            color: #22543d;
            font-weight: 600;
        }

        .option-item.wrong {
            background-color: #fed7d7 !important;
            border-color: var(--error-color) !important;
            color: #742a2a;
        }

        .option-item.disabled {
            cursor: not-allowed;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        #result-screen {
            text-align: center;
            padding: 20px 0;
        }

            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }
    </style>
</head>

    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const progressBar = document.getElementById('progress-bar');
    
    const scoreBox = document.getElementById('score-box');
    const feedbackMsg = document.getElementById('feedback-msg');
    const detailedResultsText = document.getElementById('detailed-results-text');
    const restartBtn = document.getElementById('restart-btn');

    function initQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        answered = false;
        nextBtn.disabled = true;
        
        const currentQuestion = quizData[currentQuestionIndex];
        
        // Update stats & progress
        questionCounter.innerText = `Запитання: ${currentQuestionIndex + 1}/${quizData.length}`;
        scoreCounter.innerText = `Правильно: ${score}`;
        const progressPercent = ((currentQuestionIndex) / quizData.length) * 100;
        progressBar.style.width = `${progressPercent}%`;

        // Load question text
        questionText.innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;

        // Load options
        optionsList.innerHTML = '';
        currentQuestion.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.className = 'option-item';
            li.innerText = option;
            li.addEventListener('click', () => selectOption(li, index));
            optionsList.appendChild(li);
        });
    }

    function selectOption(selectedLi, selectedIndex) {
        if (answered) return;
        
        answered = true;
        const currentQuestion = quizData[currentQuestionIndex];
        const correctIndex = currentQuestion.correct;
        
        const items = optionsList.getElementsByClassName('option-item');
        
        // Mark options
        if (selectedIndex === correctIndex) {
            selectedLi.classList.add('correct');
            score++;
            scoreCounter.innerText = `Правильно: ${score}`;
        } else {
            selectedLi.classList.add('wrong');
            items[correctIndex].classList.add('correct');
        }

        // Disable all options
        for (let item of items) {
            item.classList.add('disabled');
        }

        nextBtn.disabled = false;
    }

    nextBtn.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        
        const percentage = Math.round((score / quizData.length) * 100);
        scoreBox.innerText = `${percentage}%`;
        detailedResultsText.innerText = `Ви відповіли правильно на ${score} з ${quizData.length} запитань.`;

        if (percentage >= 90) {
            feedbackMsg.innerText = "Відмінний результат! Ви повністю готові до КРОК-М!";
            feedbackMsg.style.color = "#2f855a";
        } else if (percentage >= 70) {
            feedbackMsg.innerText = "Гарний результат! Склали успішно, але є що повторити.";
            feedbackMsg.style.color = "#2b6cb0";
        } else {
            feedbackMsg.innerText = "Потрібно підтягнути знання. Обов'язково повторіть матеріал баз тестів!";
            feedbackMsg.style.color = "#c53030";
        }
    }

    restartBtn.addEventListener('click', initQuiz);

    // Run on startup
    initQuiz();
</script>

</body>
</html>
